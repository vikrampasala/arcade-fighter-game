<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Fighter 2D | Pure JS Portfolio</title>
    <link rel="stylesheet" href="stylez.css">
</head>
<body>

    <!-- Main Arcade Container Wrap -->
    <div id="game-viewport">
        
        <!-- Top HUD Layout: Health Bars & Timer -->
        <div id="hud-container">
            <div class="health-bar-wrapper">
                <div id="p1-health-fill" class="health-fill"></div>
            </div>
            <div id="match-timer">99</div>
            <div class="health-bar-wrapper">
                <div id="p2-health-fill" class="health-fill"></div>
            </div>
        </div>

        <!-- The 2D Render Engine Canvas -->
        <canvas id="game-canvas" width="1024" height="576"></canvas>
        
        <!-- Game Over Overlay Screen Block -->
        <div id="game-over-screen">
            <h1 id="winner-text">PLAYER 1 WINS</h1>
            <button id="restart-btn">PLAY AGAIN</button>
        </div>
        
    </div>

    <script src="game.js"></script>
</body>
</html>
